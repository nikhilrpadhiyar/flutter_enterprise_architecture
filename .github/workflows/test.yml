name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-widget:
    name: Unit, widget and flow tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      # The database tests run SQLite on the host.
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error

  device-journey:
    name: Full journey on a desktop window
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Starts the local mock API inside the test and drives the real app
      # over real HTTP: sign in, create, view, update, sign out.
      - name: Run the integration test
        run: flutter test integration_test -d macos
