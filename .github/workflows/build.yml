name: Build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  android:
    name: Android release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # No value below is committed. API_BASE_URL is a repository variable and
      # SSL_PINS a secret; without them the build still compiles.
      - name: Create environment file
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.example.com/v1' }}
          SSL_PINS: ${{ secrets.SSL_PINS }}
        run: |
          mkdir -p env
          printf '{"ENV_NAME":"production","API_BASE_URL":"%s","SSL_PINS":"%s","ENABLE_HTTP_LOGGING":false}\n' \
            "$API_BASE_URL" "$SSL_PINS" > env/ci.json

      # With signing secrets the release is signed with the real key; without
      # them (forks, pull requests) the build is signed with the debug key so
      # compilation is still verified.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
            echo 'Release signing configured.'
          else
            echo 'No signing secrets; using the debug key.'
          fi

      - name: Build release APK
        run: flutter build apk --release --dart-define-from-file=env/ci.json

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  other-platforms:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # Only the Android build gates a change. The others report compile status.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            command: flutter build macos --release
          - name: iOS (no code signing)
            os: macos-latest
            command: flutter build ios --release --no-codesign
          - name: Windows
            os: windows-latest
            command: flutter build windows --release
          - name: Linux
            os: ubuntu-latest
            command: flutter build linux --release
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux build tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev libjsoncpp-dev libsqlite3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Create environment file
        shell: bash
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.example.com/v1' }}
          SSL_PINS: ${{ secrets.SSL_PINS }}
        run: |
          mkdir -p env
          printf '{"ENV_NAME":"production","API_BASE_URL":"%s","SSL_PINS":"%s","ENABLE_HTTP_LOGGING":false}\n' \
            "$API_BASE_URL" "$SSL_PINS" > env/ci.json

      - name: Build
        shell: bash
        run: ${{ matrix.command }} --dart-define-from-file=env/ci.json
